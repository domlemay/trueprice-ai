  <text x="91" y="62" font-family="&#39;Segoe UI&#39;, system-ui, sans-serif" font-weight="700" font-size="30" fill="url(#textGrad)" letter-spacing="-0.5" filter="url(#textShadow)">TruePrice</text>

  
  <rect x="260" y="41" width="38" height="22" rx="5" fill="#003836" opacity="0.5" transform="translate(2,2)"></rect>
  
