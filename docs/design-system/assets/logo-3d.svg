<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 120" fill="none">
  <defs>
    
    <linearGradient id="bg3d" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D2140"></stop>
      <stop offset="60%" stop-color="#0A1628"></stop>
      <stop offset="100%" stop-color="#051020"></stop>
    </linearGradient>
    
    <linearGradient id="cartGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4DFFF8"></stop>
      <stop offset="50%" stop-color="#00D4C8"></stop>
      <stop offset="100%" stop-color="#007A72"></stop>
    </linearGradient>
    
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#80FFF9"></stop>
      <stop offset="100%" stop-color="#00D4C8"></stop>
    </radialGradient>
    
    <linearGradient id="textGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"></stop>
      <stop offset="100%" stop-color="#C8E8F0"></stop>
    </linearGradient>
    
    <linearGradient id="aiBadge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4DFFF8"></stop>
      <stop offset="100%" stop-color="#00A89E"></stop>
    </linearGradient>
    
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"></feGaussianBlur>
      <feMerge>
        <feMergeNode in="blur"></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>
    
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#00D4C8" flood-opacity="0.35"></feDropShadow>
    </filter>
    
    <filter id="textShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00D4C8" flood-opacity="0.2"></feDropShadow>
    </filter>
  </defs>

  
  <rect width="320" height="120" rx="14" fill="url(#bg3d)"></rect>
  
  <rect width="320" height="1.5" rx="1" fill="#FFFFFF" opacity="0.06"></rect>
  
  <ellipse cx="50" cy="55" rx="38" ry="32" fill="#00D4C8" opacity="0.06"></ellipse>

  
  
