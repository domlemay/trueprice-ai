<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="tp-card-frame">
  <div class="lbl">Sémantique — état système</div>
  <div class="row">
    <div class="col">
      <div class="swatch" style="background:#2D9E5F; color:#fff"><div class="name">Succès</div><div class="hex">#2D9E5F</div></div>
      <div style="font-size:10px; color:rgba(255,255,255,.6); font-family:var(--tp-font-body)">Économies, ✓ confirm</div>
    </div>
    <div class="col">
      <div class="swatch" style="background:#F5A623; color:#0A1628"><div class="name">Warning</div><div class="hex">#F5A623</div></div>
      <div style="font-size:10px; color:rgba(255,255,255,.6); font-family:var(--tp-font-body)">Plan Entreprise</div>
    </div>
    <div class="col">
      <div class="swatch" style="background:#E53935; color:#fff"><div class="name">Erreur</div><div class="hex">#E53935</div></div>
      <div style="font-size:10px; color:rgba(255,255,255,.6); font-family:var(--tp-font-body)">Échec, hors stock</div>
    </div>
    <div class="col">
      <div class="swatch" style="background:#1976D2; color:#fff"><div class="name">Info</div><div class="hex">#1976D2</div></div>
      <div style="font-size:10px; color:rgba(255,255,255,.6); font-family:var(--tp-font-body)">Neutre / lien</div>
    </div>
  </div>
  <div class="row" style="gap:8px; margin-top:6px">
    <span style="display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border-radius:9999px; background:rgba(45,158,95,.15); color:#4CAF7D; font-size:11px; font-weight:500; font-family:var(--tp-font-body)"><span style="width:6px;height:6px;background:#2D9E5F;border-radius:50%"></span>Économisez 356 $</span>
    <span style="display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border-radius:9999px; background:rgba(245,166,35,.15); color:#F5A623; font-size:11px; font-weight:500; font-family:var(--tp-font-body)">ENTREPRISE</span>
    <span style="display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border-radius:9999px; background:rgba(229,57,53,.15); color:#FF6B6B; font-size:11px; font-weight:500; font-family:var(--tp-font-body)">Hors stock</span>
  </div>
