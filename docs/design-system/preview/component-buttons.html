<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="tp-card-frame">
  <div class="lbl">Buttons — primary &amp; secondary</div>
  <div style="display:flex; flex-wrap:wrap; gap:12px; align-items:center">
    <button style="background:#00D4C8; color:#0A1628; border:none; border-radius:8px; padding:10px 18px; font-family:'DM Sans',sans-serif; font-weight:500; font-size:14px; cursor:pointer">Essayer gratuitement</button>
    <button style="background:#00A89E; color:#0A1628; border:none; border-radius:8px; padding:10px 18px; font-family:'DM Sans',sans-serif; font-weight:500; font-size:14px; box-shadow:0 0 20px rgba(0,212,200,.3); transform:translateY(-1px)">Hover</button>
    <button style="background:#007A72; color:#0A1628; border:none; border-radius:8px; padding:10px 18px; font-family:'DM Sans',sans-serif; font-weight:500; font-size:14px">Pressed</button>
    <button style="background:#00D4C8; color:#0A1628; border:none; border-radius:8px; padding:10px 18px; font-family:'DM Sans',sans-serif; font-weight:500; font-size:14px; opacity:.5">Disabled</button>
  </div>
  <div style="display:flex; flex-wrap:wrap; gap:12px; align-items:center">
    <button style="background:transparent; color:#00D4C8; border:1px solid rgba(0,212,200,.4); border-radius:8px; padding:9px 18px; font-family:'DM Sans',sans-serif; font-weight:500; font-size:14px; cursor:pointer">Se connecter</button>
    <button style="background:rgba(0,212,200,.08); color:#00D4C8; border:1px solid rgba(0,212,200,.4); border-radius:8px; padding:9px 18px; font-family:'DM Sans',sans-serif; font-weight:500; font-size:14px">Hover</button>
    <button style="background:transparent; color:rgba(255,255,255,.7); border:none; border-radius:8px; padding:9px 14px; font-family:'DM Sans',sans-serif; font-weight:500; font-size:14px; cursor:pointer">Ghost</button>
    <a href="#" style="color:#00D4C8; font-family:'DM Sans',sans-serif; font-size:14px; text-decoration:none; border-bottom:1px solid #00D4C8">Voir la démo →</a>
  </div>
</div></body></html>
