<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="tp-card-frame">
  <div class="lbl">Logos — variantes</div>
  <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px">
    <div style="background:#0A1628; border-radius:12px; padding:18px; display:flex; align-items:center; justify-content:center; border:1px solid rgba(0,212,200,.15); height:90px">
      <img src="../assets/logo-dark.svg" alt="logo dark" style="height:50px"/>
    </div>
    <div style="background:#FFFFFF; border-radius:12px; padding:18px; display:flex; align-items:center; justify-content:center; height:90px">
      <img src="../assets/logo-light.svg" alt="logo light" style="height:50px"/>
    </div>
    <div style="background:#0A1628; border-radius:12px; padding:18px; display:flex; align-items:center; justify-content:center; border:1px solid rgba(0,212,200,.15); height:90px; gap:10px">
      <img src="../assets/icon-only.svg" alt="icon only" style="height:48px"/>
      <span style="font-family:var(--tp-font-mono); font-size:10px; color:rgba(255,255,255,.5)">icon-only</span>
    </div>
    <div style="background:#FFFFFF; border-radius:12px; padding:18px; display:flex; align-items:center; justify-content:center; height:90px; gap:10px">
      <img src="../assets/text-only-light.svg" alt="text only" style="height:32px"/>
    </div>
  </div>
</div></body></html>
