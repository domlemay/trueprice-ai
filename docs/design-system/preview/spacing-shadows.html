<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="tp-card-frame">
  <div class="lbl">Shadows &amp; glow</div>
  <div style="display:grid; grid-template-columns:repeat(3,1fr); gap:18px">
    <div style="display:flex; flex-direction:column; align-items:center; gap:6px">
      <div style="width:90px; height:60px; background:#112040; border:1px solid rgba(0,212,200,.15); border-radius:8px; box-shadow:0 1px 3px rgba(0,0,0,.3)"></div>
      <div style="font-family:var(--tp-font-mono); font-size:10px; color:rgba(255,255,255,.7)">shadow-sm</div>
    </div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:6px">
      <div style="width:90px; height:60px; background:#112040; border:1px solid rgba(0,212,200,.15); border-radius:8px; box-shadow:0 4px 12px rgba(0,0,0,.4)"></div>
      <div style="font-family:var(--tp-font-mono); font-size:10px; color:rgba(255,255,255,.7)">shadow-md · cards</div>
    </div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:6px">
      <div style="width:90px; height:60px; background:#112040; border:1px solid rgba(0,212,200,.15); border-radius:8px; box-shadow:0 8px 24px rgba(0,0,0,.5)"></div>
      <div style="font-family:var(--tp-font-mono); font-size:10px; color:rgba(255,255,255,.7)">shadow-lg · hover</div>
    </div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:6px">
      <div style="width:90px; height:60px; background:#00D4C8; border-radius:8px; box-shadow:0 0 20px rgba(0,212,200,.3)"></div>
      <div style="font-family:var(--tp-font-mono); font-size:10px; color:#00D4C8">glow · CTA</div>
    </div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:6px">
      <div style="width:90px; height:60px; background:#00D4C8; border-radius:8px; box-shadow:0 0 40px rgba(0,212,200,.5)"></div>
      <div style="font-family:var(--tp-font-mono); font-size:10px; color:#00D4C8">glow-strong</div>
    </div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:6px">
      <div style="width:90px; height:60px; background:#112040; border:1px solid rgba(0,212,200,.4); border-radius:8px; box-shadow:0 0 16px rgba(0,212,200,.2)"></div>
      <div style="font-family:var(--tp-font-mono); font-size:10px; color:rgba(255,255,255,.7)">focus ring</div>
    </div>
  </div>
</div></body></html>
