<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="tp-card-frame">
  <div class="lbl">Cards — default, hover, featured</div>
  <div style="display:grid; grid-template-columns:repeat(3,1fr); gap:12px">
    <div style="background:#112040; border:1px solid rgba(0,212,200,.15); border-radius:12px; padding:16px 18px; box-shadow:0 4px 12px rgba(0,0,0,.4)">
      <div style="font-family:'DM Sans',sans-serif; font-weight:700; font-size:13px; color:#fff; margin-bottom:4px">Card · default</div>
      <div style="font-family:'DM Sans',sans-serif; font-size:11px; color:rgba(255,255,255,.5); line-height:1.5">Border 0.15 · shadow-md · radius 12.</div>
    </div>
    <div style="background:#112040; border:1px solid rgba(0,212,200,.35); border-radius:12px; padding:16px 18px; box-shadow:0 8px 24px rgba(0,0,0,.5); transform:translateY(-2px)">
      <div style="font-family:'DM Sans',sans-serif; font-weight:700; font-size:13px; color:#fff; margin-bottom:4px">Card · hover</div>
      <div style="font-family:'DM Sans',sans-serif; font-size:11px; color:rgba(255,255,255,.5); line-height:1.5">Border 0.35 · lift +2px · shadow-lg.</div>
    </div>
    <div style="background:linear-gradient(135deg, rgba(0,212,200,.1), rgba(0,212,200,.02)); border:1px solid rgba(0,212,200,.5); border-radius:12px; padding:16px 18px; box-shadow:0 0 24px rgba(0,212,200,.2); position:relative">
      <span style="position:absolute; top:-8px; left:14px; background:#00D4C8; color:#0A1628; padding:2px 8px; border-radius:4px; font-family:'DM Sans',sans-serif; font-weight:700; font-size:9px; letter-spacing:.08em">FEATURED</span>
      <div style="font-family:'DM Sans',sans-serif; font-weight:700; font-size:13px; color:#fff; margin-bottom:4px">Card · meilleur prix</div>
      <div style="font-family:'DM Sans',sans-serif; font-size:11px; color:rgba(255,255,255,.6); line-height:1.5">Cyan halo + tinted bg.</div>
    </div>
  </div>
</div></body></html>
