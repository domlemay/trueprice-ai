<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="tp-card-frame">
  <div class="lbl">Price comparison row</div>
  <div style="display:flex; flex-direction:column; gap:8px">
    <div style="display:flex; align-items:center; gap:14px; background:rgba(0,212,200,.08); border:1px solid rgba(0,212,200,.4); border-radius:10px; padding:12px 14px; box-shadow:0 0 16px rgba(0,212,200,.15)">
      <span style="font-size:18px">🇺🇸</span>
      <div style="flex:1; min-width:0">
        <div style="font-family:'DM Sans',sans-serif; font-weight:500; font-size:13px; color:#fff">Amazon.com</div>
        <div style="font-family:'JetBrains Mono',monospace; font-size:11px; color:rgba(255,255,255,.5)">997 USD</div>
      </div>
      <div style="text-align:right">
        <div style="font-family:'JetBrains Mono',monospace; font-weight:700; font-size:15px; color:#00D4C8">1 142 $ <span style="font-size:11px; opacity:.7">CAD</span></div>
        <div style="font-family:'DM Sans',sans-serif; font-size:11px; color:#4CAF7D; font-weight:500">Économisez 356 $</div>
      </div>
      <span style="background:#00D4C8; color:#0A1628; padding:3px 8px; border-radius:4px; font-family:'DM Sans',sans-serif; font-weight:700; font-size:10px; text-transform:uppercase; letter-spacing:.08em">MEILLEUR</span>
    </div>
    <div style="display:flex; align-items:center; gap:14px; background:rgba(255,255,255,.03); border:1px solid rgba(255,255,255,.06); border-radius:10px; padding:12px 14px">
      <span style="font-size:18px">🇨🇦</span>
      <div style="flex:1; min-width:0">
        <div style="font-family:'DM Sans',sans-serif; font-weight:500; font-size:13px; color:#fff">Best Buy Canada</div>
        <div style="font-family:'JetBrains Mono',monospace; font-size:11px; color:rgba(255,255,255,.5)">1 498 $ CAD</div>
      </div>
      <div style="text-align:right">
        <div style="font-family:'JetBrains Mono',monospace; font-weight:700; font-size:15px; color:#fff">1 498 $ <span style="font-size:11px; opacity:.7">CAD</span></div>
        <div style="font-family:'DM Sans',sans-serif; font-size:11px; color:rgba(255,255,255,.4)">Référence</div>
      </div>
      <span style="color:rgba(255,255,255,.4); width:64px; text-align:right">›</span>
    </div>
  </div>
</div></body></html>
