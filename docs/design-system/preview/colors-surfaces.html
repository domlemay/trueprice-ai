<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="tp-card-frame">
  <div class="lbl">Surfaces dark mode — élévation</div>
  <div style="display:grid; grid-template-columns:repeat(3,1fr); gap:10px">
    <div style="background:#0A1628; padding:14px; border-radius:8px; border:1px solid rgba(0,212,200,.15)">
      <div style="font-size:10px; color:rgba(255,255,255,.5); text-transform:uppercase; letter-spacing:.1em; font-family:var(--tp-font-body)">Base</div>
      <div style="font-family:var(--tp-font-mono); font-size:12px; color:#fff; margin-top:4px">#0A1628</div>
      <div style="font-size:10px; color:rgba(255,255,255,.5); font-family:var(--tp-font-body); margin-top:2px">--tp-bg-base</div>
    </div>
    <div style="background:#0F1E36; padding:14px; border-radius:8px; border:1px solid rgba(0,212,200,.15)">
      <div style="font-size:10px; color:rgba(255,255,255,.5); text-transform:uppercase; letter-spacing:.1em; font-family:var(--tp-font-body)">Surface</div>
      <div style="font-family:var(--tp-font-mono); font-size:12px; color:#fff; margin-top:4px">#0F1E36</div>
      <div style="font-size:10px; color:rgba(255,255,255,.5); font-family:var(--tp-font-body); margin-top:2px">--tp-bg-surface</div>
    </div>
    <div style="background:#112040; padding:14px; border-radius:8px; border:1px solid rgba(0,212,200,.15)">
      <div style="font-size:10px; color:rgba(255,255,255,.5); text-transform:uppercase; letter-spacing:.1em; font-family:var(--tp-font-body)">Card</div>
      <div style="font-family:var(--tp-font-mono); font-size:12px; color:#fff; margin-top:4px">#112040</div>
      <div style="font-size:10px; color:rgba(255,255,255,.5); font-family:var(--tp-font-body); margin-top:2px">--tp-bg-card</div>
    </div>
    <div style="background:#0D2140; padding:14px; border-radius:8px; border:1px solid rgba(0,212,200,.15)">
      <div style="font-size:10px; color:rgba(255,255,255,.5); text-transform:uppercase; letter-spacing:.1em; font-family:var(--tp-font-body)">Elevated</div>
      <div style="font-family:var(--tp-font-mono); font-size:12px; color:#fff; margin-top:4px">#0D2140</div>
      <div style="font-size:10px; color:rgba(255,255,255,.5); font-family:var(--tp-font-body); margin-top:2px">--tp-bg-elevated</div>
    </div>
    <div style="background:#0D1E38; padding:14px; border-radius:8px; border:1px solid rgba(0,212,200,.15)">
      <div style="font-size:10px; color:rgba(255,255,255,.5); text-transform:uppercase; letter-spacing:.1em; font-family:var(--tp-font-body)">Input</div>
      <div style="font-family:var(--tp-font-mono); font-size:12px; color:#fff; margin-top:4px">#0D1E38</div>
      <div style="font-size:10px; color:rgba(255,255,255,.5); font-family:var(--tp-font-body); margin-top:2px">--tp-bg-input</div>
    </div>
    <div style="background:#071020; padding:14px; border-radius:8px; border:1px solid rgba(0,212,200,.15)">
      <div style="font-size:10px; color:rgba(255,255,255,.5); text-transform:uppercase; letter-spacing:.1em; font-family:var(--tp-font-body)">Overlay</div>
      <div style="font-family:var(--tp-font-mono); font-size:12px; color:#fff; margin-top:4px">#071020</div>
      <div style="font-size:10px; color:rgba(255,255,255,.5); font-family:var(--tp-font-body); margin-top:2px">--tp-bg-overlay</div>
    </div>
  </div>
</div></body></html>
