<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="tp-card-frame">
  <div class="lbl">Hiérarchie texte — dark mode</div>
  <div style="display:flex; flex-direction:column; gap:10px">
    <div style="display:flex; align-items:baseline; gap:16px">
      <span style="color:#fff; font-size:16px; font-family:var(--tp-font-body); flex:1">Texte primaire — 100%</span>
      <code style="font-family:var(--tp-font-mono); font-size:11px; color:rgba(255,255,255,.5)">#FFFFFF</code>
    </div>
    <div style="display:flex; align-items:baseline; gap:16px">
      <span style="color:rgba(255,255,255,.7); font-size:16px; font-family:var(--tp-font-body); flex:1">Texte secondaire — 70% blanc</span>
      <code style="font-family:var(--tp-font-mono); font-size:11px; color:rgba(255,255,255,.5)">rgba(#fff, .7)</code>
    </div>
    <div style="display:flex; align-items:baseline; gap:16px">
      <span style="color:rgba(255,255,255,.4); font-size:16px; font-family:var(--tp-font-body); flex:1">Texte muet / placeholder — 40%</span>
      <code style="font-family:var(--tp-font-mono); font-size:11px; color:rgba(255,255,255,.5)">rgba(#fff, .4)</code>
    </div>
    <div style="display:flex; align-items:baseline; gap:16px">
      <span style="color:#00D4C8; font-size:16px; font-family:var(--tp-font-body); flex:1; font-weight:500">Texte accent / lien — cyan 500</span>
      <code style="font-family:var(--tp-font-mono); font-size:11px; color:rgba(255,255,255,.5)">#00D4C8</code>
    </div>
  </div>
  <div style="font-family:var(--tp-font-body); font-size:10px; color:rgba(255,255,255,.45); margin-top:4px; line-height:1.5">
    Aucun gris générique. Utilisez les niveaux d'opacité du blanc.
  </div>
</div></body></html>
