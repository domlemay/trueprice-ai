<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="tp-card-frame">
  <div class="lbl">Cyan — signature accent</div>
  <div class="row">
    <div class="swatch" style="background:#E0FFFE; color:#005C56"><div class="name">50</div><div class="hex">#E0FFFE</div></div>
    <div class="swatch" style="background:#B3FEFA; color:#005C56"><div class="name">100</div><div class="hex">#B3FEFA</div></div>
    <div class="swatch" style="background:#80FDF7; color:#005C56"><div class="name">200</div><div class="hex">#80FDF7</div></div>
    <div class="swatch" style="background:#4DFFF8; color:#005C56"><div class="name">300 ✦</div><div class="hex">#4DFFF8</div></div>
    <div class="swatch" style="background:#00E5DB; color:#0A1628"><div class="name">400</div><div class="hex">#00E5DB</div></div>
    <div class="swatch" style="background:#00D4C8; color:#0A1628; box-shadow:0 0 12px rgba(0,212,200,.3)"><div class="name">500 ★</div><div class="hex">#00D4C8</div></div>
    <div class="swatch" style="background:#00A89E; color:#0A1628"><div class="name">600</div><div class="hex">#00A89E</div></div>
    <div class="swatch" style="background:#0D9488; color:#fff"><div class="name">700 ★</div><div class="hex">#0D9488</div></div>
    <div class="swatch" style="background:#007A72; color:#fff"><div class="name">800</div><div class="hex">#007A72</div></div>
    <div class="swatch" style="background:#005C56; color:#fff"><div class="name">900</div><div class="hex">#005C56</div></div>
  </div>
  <div style="font-family:var(--tp-font-body); font-size:11px; color:rgba(255,255,255,.55); line-height:1.5">
    <strong style="color:#fff">★ 500</strong> — primary in dark mode (logo, CTA, AI badges).
    <strong style="color:#fff">★ 700</strong> — primary in light mode.
    <strong style="color:#fff">✦ 300</strong> — glow / hover highlight.
  </div>
</div></body></html>
