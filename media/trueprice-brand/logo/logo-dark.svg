<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 100" fill="none">
  <!-- Background -->
  <rect width="320" height="100" rx="12" fill="#0A1628"/>

  <!-- === ICON === -->
  <!-- Cart body -->
  <path d="M18 32h8l9 30h32l7-24H42" stroke="#00D4C8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Cart handle -->
  <path d="M14 24h8" stroke="#00D4C8" stroke-width="4" stroke-linecap="round"/>
  <!-- Wheels -->
  <circle cx="34" cy="67" r="3.5" fill="#00D4C8"/>
  <circle cx="55" cy="67" r="3.5" fill="#00D4C8"/>
  <!-- Network nodes inside cart -->
  <circle cx="42" cy="46" r="2.8" fill="#00D4C8"/>
  <circle cx="53" cy="40" r="2.8" fill="#00D4C8"/>
  <circle cx="62" cy="50" r="2.8" fill="#00D4C8"/>
  <circle cx="50" cy="55" r="2.3" fill="#00D4C8"/>
  <!-- Network lines -->
  <line x1="42" y1="46" x2="53" y2="40" stroke="#00D4C8" stroke-width="1.2" opacity="0.7"/>
  <line x1="53" y1="40" x2="62" y2="50" stroke="#00D4C8" stroke-width="1.2" opacity="0.7"/>
  <line x1="42" y1="46" x2="50" y2="55" stroke="#00D4C8" stroke-width="1.2" opacity="0.7"/>
  <line x1="62" y1="50" x2="50" y2="55" stroke="#00D4C8" stroke-width="1.2" opacity="0.7"/>
  <line x1="53" y1="40" x2="50" y2="55" stroke="#00D4C8" stroke-width="1.2" opacity="0.45"/>

  <!-- === TEXT === -->
  <!-- TruePrice -->
  <text x="90" y="58" font-family="'Segoe UI', system-ui, sans-serif" font-weight="700" font-size="28" fill="#FFFFFF" letter-spacing="-0.5">TruePrice</text>
  <!-- AI badge -->
  <rect x="254" y="36" width="34" height="20" rx="4" fill="#00D4C8"/>
  <text x="261" y="51" font-family="'Segoe UI', system-ui, sans-serif" font-weight="800" font-size="13" fill="#0A1628" letter-spacing="0.5">AI</text>

  <!-- Tagline -->
  <text x="90" y="74" font-family="'Segoe UI', system-ui, sans-serif" font-weight="400" font-size="10" fill="#00D4C8" opacity="0.75" letter-spacing="1.5">PRIX INTELLIGENT · DÉCISIONS CLAIRES</text>
</svg>
